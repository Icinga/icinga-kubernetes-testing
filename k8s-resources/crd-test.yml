apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tests.icinga.com
spec:
  group: icinga.com
  scope: Namespaced
  names:
    kind: Test
    listKind: TestList
    plural: tests
    singular: test
    shortNames:
      - tst
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: { }
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                resourceType:
                  type: string
                resourceName:
                  type: string
                description:
                  type: string
                expectedPods:
                  format: int32
                  type: integer
                  minimum: 1
                tests:
                  type: array
                  items:
                    type: object
                    properties:
                      testKind:
                        type: string
                      testPercentage:
                        format: int32
                        type: integer
                        minimum: 1
                        maximum: 100
                    required:
                      - testKind
                      - testPercentage
            status:
              type: object
              properties:
                availablePods:
                  format: int32
                  type: integer
                  minimum: 0
