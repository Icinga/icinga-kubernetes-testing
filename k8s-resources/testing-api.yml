---
apiVersion: v1
kind: Pod
metadata:
  name: icinga-for-kubernetes-testing-api
  namespace: testing
  labels:
    app: icinga-for-kubernetes-testing-api
spec:
  serviceAccountName: icinga-for-kubernetes-testing-pod-creator-service-account
  containers:
    - name: icinga-for-kubernetes-testing-testing-api
      image: ikt-api
      imagePullPolicy: Never
      ports:
        - containerPort: 8080
          name: http
  restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: icinga-for-kubernetes-testing-api-nodeport
  namespace: testing
spec:
  type: NodePort
  selector:
    app: icinga-for-kubernetes-testing-api
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30002
      name: http

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: icinga-for-kubernetes-testing-pod-creator
rules:
  - apiGroups: [ "", "icinga.com", "apps" ]
    resources: [ "nodes", "pods", "tests", "deployments", "replicasets", "statefulsets", "daemonsets", "tests/status", "events" ]
    verbs: [ "create", "delete", "get", "list", "watch", "update", "patch", "deletecollection" ]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: icinga-for-kubernetes-testing-pod-creator-binding
subjects:
  - kind: ServiceAccount
    name: icinga-for-kubernetes-testing-pod-creator-service-account
    namespace: testing
roleRef:
  kind: ClusterRole
  name: icinga-for-kubernetes-testing-pod-creator
  apiGroup: rbac.authorization.k8s.io

